[project]
name = "student-feedback-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "matplotlib>=3.8",
    "numpy>=1.26,<3",
    "openpyxl>=3.1",
    "pandas>=2.2,<4",
    "pillow>=10.3",
    "plotly>=5.20",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pytest>=8.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
    "streamlit>=1.36",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
student-feedback-agent = "student_feedback_agent:main"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["B008"]
